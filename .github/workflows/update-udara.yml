name: Perbarui data udara

on:
  schedule:
    - cron: '17 * * * *'  # setiap jam, menit ke-17 (hindari menit ke-0/1 yang paling padat di GitHub)
  workflow_dispatch:       # tombol "Run workflow" untuk uji manual

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ambil data udara
        run: node ambil-udara.mjs
      - name: Simpan bila ada perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add udara.json
          git commit -m "Perbarui data udara" || exit 0
          git push
